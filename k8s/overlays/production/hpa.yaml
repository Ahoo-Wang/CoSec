# Scales on CPU, relative to the 1 CPU each gateway requests; needs the metrics server. Pods that are not ready yet
# (no platform document) do not count towards a scale-up.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cosec-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cosec-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
