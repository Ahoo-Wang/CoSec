# Admits connections to the gateway's HTTP port from anywhere, and to the management port (the Prometheus scrape,
# /actuator/prometheus, and /actuator/health) from the monitoring namespace only; narrow both `from` to your ingress
# controller and your Prometheus. Every other port stays closed. The kubelet's probes use the HTTP port. Needs a
# network plugin that enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosec-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cosec-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
    - from:
        # The namespace your Prometheus runs in: a label every namespace has.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: management
          protocol: TCP
