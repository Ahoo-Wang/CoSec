apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosec-control
spec:
  template:
    spec:
      containers:
        - name: cosec-control
          env:
            # A 2 GiB heap for a 3200Mi limit, by the gateway's rule (the heap, plus the direct memory, plus about 250 MiB,
            # plus a quarter). The control host holds two snapshot sources, each an entry per tenant it decides for, up to
            # max-tenants (16,384 by default, about 490 MB at 30 KB each): size the heap as 2 x (max-tenants x 30 KB) +
            # 256 MiB + three times the largest change record, then the limit by the rule. Change heap and limit together,
            # and with cosec.authorization.snapshot.max-tenants.
            - name: JVM_MEMORY_OPTS
              value: -Xms2g -Xmx2g -XX:MaxDirectMemorySize=256m -XX:MaxMetaspaceSize=256m
            # The control host's own Redis account, from the Secret cosec-control-redis-credentials, which you create: password
            # is required, username is for a Redis ACL user and may be left out. Never the gateways' account: it must not
            # write the documents.
            - name: SPRING_DATA_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cosec-control-redis-credentials
                  key: username
                  optional: true
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cosec-control-redis-credentials
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 3200Mi
            limits:
              cpu: "2"
              memory: 3200Mi
