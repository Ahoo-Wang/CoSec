apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosec-gateway
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cosec-gateway
      containers:
        - name: cosec-gateway
          env:
            # A 1.5 GB heap for a 2560Mi limit: room for the default snapshot bounds full, 16,384 tenant documents and
            # 65,536 tenants without one, about 520 MB at 30 KB a document ("Sizing a SaaS gateway" in the deployment
            # docs, which also has the memory model). Change both together, and with max-tenants.
            - name: JVM_MEMORY_OPTS
              value: -Xms1536m -Xmx1536m -XX:MaxDirectMemorySize=256m -XX:MaxMetaspaceSize=256m
            # From the Secret cosec-redis-secret, which you create: password is required, username is for a Redis
            # ACL user and may be left out.
            - name: SPRING_DATA_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cosec-redis-secret
                  key: username
                  optional: true
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cosec-redis-secret
                  key: password
          resources:
            requests:
              cpu: "1"
              memory: 2560Mi
            limits:
              cpu: "2"
              memory: 2560Mi
