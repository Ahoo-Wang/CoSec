apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosec-gateway
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cosec-gateway
      containers:
        - name: cosec-gateway
          env:
            # A 2 GiB heap for a 3200Mi limit: the documents' quarter (512 MiB: about 13,700 typical tenant documents and
            # 65,280 tenants without one) and the two revocation copies, an 8th of the heap (516,222 entries each, about
            # 260 MB): about 780 MB live, twice that for ZGC plus 256 MiB for the rest of the gateway ("Sizing a SaaS
            # gateway" in the deployment docs, which also has the memory model). The documents, the revocation copies, the
            # token cache and the listener queues are shares of this heap: change heap and limit together, and give a
            # gateway that must hold 16,384 typical tenants a 2.5 GiB heap.
            - name: JVM_MEMORY_OPTS
              value: -Xms2g -Xmx2g -XX:MaxDirectMemorySize=256m -XX:MaxMetaspaceSize=256m
            # From the Secret cosec-redis-secret, which you create: password is required, username is for a Redis
            # ACL user and may be left out.
            - name: SPRING_DATA_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cosec-redis-secret
                  key: username
                  optional: true
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cosec-redis-secret
                  key: password
          resources:
            requests:
              cpu: "1"
              memory: 3200Mi
            limits:
              cpu: "2"
              memory: 3200Mi
