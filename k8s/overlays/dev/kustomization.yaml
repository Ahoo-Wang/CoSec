# UNSAFE ON A SHARED CLUSTER. This overlay states, for the control plane's host, that nothing but the gateway and the
# services you name can reach it (COSEC_PIPELINE_IDENTITY_ONLYTRUSTEDCALLERSCANREACH=true, below), and kind's network
# plugin, like others, does not enforce the NetworkPolicies that would make that true: on such a cluster any pod can reach
# the host, state a platform administrator, and publish and approve any policy. The Job cosec-control-boundary-check says
# which it is on yours (it fails on kind). Apply it only to a cluster of your own that nothing else runs on.
#
# For trying CoSec out: one gateway with the base's small resources (768Mi, a 256 MB heap), the control plane's host with
# its small ones (1536Mi, a 768 MB heap), and a single Redis in the same namespace. Not for production.
#
#   kubectl create namespace cosec-dev
#   kubectl -n cosec-dev create secret generic cosec-jwt-secret --from-literal=secret="$(openssl rand -base64 48)"
#   kubectl apply -k k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cosec-dev

resources:
  - ../../base
  - ../../control
  - redis.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: cosec
    includeTemplates: true

configMapGenerator:
  - name: cosec-gateway-redis
    literals:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
  # The control plane's host, on the same Redis. No password, so no Secret: the production overlay's account is the
  # control host's alone.
  - name: cosec-control-redis
    literals:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

patches:
  # The statement the control host starts on, made here for a throwaway cluster of your own (the warning above): true there
  # only because nothing else runs on it, not because of the policies.
  - target:
      kind: Deployment
      name: cosec-control
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: COSEC_PIPELINE_IDENTITY_ONLYTRUSTEDCALLERSCANREACH
          value: "true"
