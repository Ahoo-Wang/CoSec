# The gateway's configuration, mounted as the image's /opt/cosec-gateway-server/config/application.yaml. The image keeps
# its own defaults in the jar and reads this file in addition, key by key, so a key left out here keeps the image's value;
# this file repeats them to be readable on its own. Every property is in https://cosec.ahoo.me/operations/configuration;
# the Redis address comes from the overlay's cosec-gateway-redis ConfigMap, the JWT secret from the Secret
# cosec-jwt-secret.
#
# DEMO: the CORS origin, the discovery list and the route below show where your own go. Replace them before you
# use this base for anything but a first look.
server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1KB
spring:
  application:
    name: ${service.name:cosec-gateway}
  web:
    error:
      whitelabel:
        enabled: false
  cloud:
    # DEMO. The image has no Kubernetes discovery client, so an lb:// route resolves through this list: here, a Service
    # cosec-auth in the gateway's namespace, which does not exist until you create it. Replace with your services.
    discovery:
      client:
        simple:
          instances:
            cosec-auth:
              - uri: http://cosec-auth:80
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                # DEMO: your front end's origin, never "*" on a gateway that decides who may call what. A browser
                # page from any other origin cannot read the gateway's answers.
                allowed-origins: "https://app.example.com"
                allowed-methods: "*"
                allowed-headers: "*"
                exposed-headers: "*"
                # Seconds: browsers cap it, 30 minutes here.
                max-age: 1800
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            # DEMO: a route to the Service cosec-auth (the login host of the quick start, if you run one).
            - id: cosec-auth
              uri: lb://cosec-auth
              predicates:
                - Path=/cosec-auth/**
              filters:
                - StripPrefix=1
cosec:
  audit:
    kafka:
      enabled: false
  authentication:
    login:
      enabled: false
  jwt:
    algorithm: hmac256
    secret: ${COSEC_JWT_SECRET} # no fallback: startup fails if the secret is missing
  ip2region:
    enabled: false

logging:
  level:
    root: info
management:
  server:
    # The actuator is served on this port only (the image's default), never on the gateway's. Keep it inside the
    # cluster: nothing in CoSec authorizes it.
    port: 8081
  endpoint:
    health:
      # /livez and /readyz on the gateway's port for the probes (they prove the listener clients use; CoSec does not
      # decide them), and /actuator/health/* on the management port. Readiness stays REFUSING_TRAFFIC until the
      # platform document is installed.
      probes:
        enabled: true
        add-additional-paths: true
    # The gateway endpoint can read and change routes. Off, so exposing it by mistake exposes nothing.
    gateway:
      access: none
  endpoints:
    web:
      exposure:
        # Health, and the Prometheus scrape endpoint (/actuator/prometheus) on the management port. CoSec authorizes the
        # gateway's routes, not its actuator endpoints.
        include: health,prometheus
