# TEMPORARY: measures the ghcr -> Aliyun copy for #1332. Deleted before merge.
name: Aliyun copy experiment
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aliyun-copy-experiment.yml'
permissions:
  contents: read
  packages: read
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REG: registry.cn-shanghai.aliyuncs.com
      SRC: ghcr.io/ahoo-wang/cosec-gateway:pr-1332
      DST: registry.cn-shanghai.aliyuncs.com/ahoo/cosec-gateway:pr-1332
      ALIYUN_CR_USERNAME: ${{ secrets.ALIYUN_CR_USERNAME }}
      ALIYUN_CR_TOKEN: ${{ secrets.ALIYUN_CR_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sizes of the source
        run: |
          docker buildx imagetools inspect --raw "$SRC" | jq .
          for d in $(docker buildx imagetools inspect --raw "$SRC" | jq -r '.manifests[].digest'); do
            docker buildx imagetools inspect --raw "ghcr.io/ahoo-wang/cosec-gateway@$d" | jq -c '{layers: [.layers[].size], total: ([.layers[].size]|add)}'
          done
      - name: Login to Aliyun
        run: echo "$ALIYUN_CR_TOKEN" | docker login "$REG" --username "$ALIYUN_CR_USERNAME" --password-stdin
      - name: Which blobs does Aliyun already have
        continue-on-error: true
        run: |
          for d in $(docker buildx imagetools inspect --raw "$SRC" | jq -r '.manifests[].digest'); do
            for b in $(docker buildx imagetools inspect --raw "ghcr.io/ahoo-wang/cosec-gateway@$d" | jq -r '.layers[].digest, .config.digest'); do
              code=$(curl -s -o /dev/null -w '%{http_code} %{time_total}s' -I -u "$ALIYUN_CR_USERNAME:$ALIYUN_CR_TOKEN" "https://$REG/v2/ahoo/cosec-gateway/blobs/$b")
              echo "$d $b -> $code"
            done
          done
      - name: Download speed from ghcr
        continue-on-error: true
        run: |
          date -u +%T
          time docker pull --platform linux/amd64 "$SRC" >/dev/null
          date -u +%T
      - name: Copy again with crane, everything already there
        continue-on-error: true
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz | tar xz crane
          echo "${{ secrets.GITHUB_TOKEN }}" | ./crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          echo "$ALIYUN_CR_TOKEN" | ./crane auth login "$REG" -u "$ALIYUN_CR_USERNAME" --password-stdin
          date -u +%T
          time timeout 900 ./crane copy -v "$SRC" "$DST"; echo "exit=$?"
          date -u +%T
      - name: Copy again with imagetools, everything already there
        continue-on-error: true
        run: |
          date -u +%T
          time timeout 900 docker buildx imagetools create --tag "$DST" "$SRC"; echo "exit=$?"
          date -u +%T
      - name: Cancelled attempt, blobs after it
        continue-on-error: true
        run: |
          # a tag whose blobs are all there, so nothing is cancelled mid-upload: only shows how long a no-op copy takes
          set +e
          time timeout 60 docker buildx imagetools create --tag "${DST}-noop" "$SRC"; echo "exit=$?"
          docker buildx imagetools inspect "$DST" | head -12
