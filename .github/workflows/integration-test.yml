name: Integration Test
on: [ pull_request ]

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cosec-engine-test:
    name: CoSec Engine Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test CoSec-Model and CoSec-Engine
        run: ./gradlew cosec-model:clean cosec-engine:clean cosec-model:check cosec-engine:check

  cosec-runtime-test:
    name: CoSec Runtime Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test CoSec-Runtime
        run: ./gradlew cosec-runtime:clean cosec-runtime:check

  cosec-control-test:
