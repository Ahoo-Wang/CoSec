# Security-focused static analysis (GitHub code scanning). Complements detekt and ESLint, which cover style and
# code smells. Kotlin requires CodeQL to observe a real compilation, hence the manual build without
# daemon or build cache; JavaScript and TypeScript need none (build-mode none), in a job of their own.
name: CodeQL
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'wiki/**'
      - 'docs/**'
      - '**/*.md'
      - 'skills/**'
  pull_request:
    # No path filter here: "Analyze (java-kotlin)" is a required check, so a skipped run would block docs-only PRs.
    branches: [ main ]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      # Two commits: on a pull request the checkout is the merge of the pull request into `main`, and the decision below reads
      # what the pull request changes as the difference between that merge and its first parent (`main`'s commit).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A required check that has nothing to analyse reports success at once, and says so (scripts/ci/codeql_needed.py): the
      # analysis is a traced build of 8 to 9 minutes, and it sees Kotlin, Java and what the build reads. Every push to `main`,
      # the scheduled run and a manual run analyse in full, always; a pull request that changes none of those files skips
      # the steps below, which carry the decision. Its list errs wide and is held to the tree by scripts/ci/test_codeql_needed.py.
      - name: Decide whether there is anything to analyse
        id: decide
        run: python3 -I scripts/ci/codeql_needed.py --event "$GITHUB_EVENT_NAME"

      # No Gradle cache, on purpose: the closest entry a pull request restores is another job's (the gateway image's), whose
      # index names jars it does not hold, and Gradle then answers "Could not find" for everything else without asking a
      # repository (what jmh-ab.yml found, #1490; this job's first run with a cache failed that way, four attempts in a row).
      # A cold resolution is protected by the retried step below instead.
      - name: Set up JDK 21
        if: steps.decide.outputs.analyse == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Downloads only, retried, before CodeQL traces anything (.github/scripts/resolve-dependencies.sh): Gradle's own
      # distribution, the plugins and every dependency, so that the traced build below finds them and the retry never wraps
      # a compilation. services.gradle.org answers 504 often enough to fail this required check; this covers it too.
      - name: Resolve the dependencies
        if: steps.decide.outputs.analyse == 'true'
        run: .github/scripts/resolve-dependencies.sh

      - name: Initialize CodeQL
        if: steps.decide.outputs.analyse == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # The CodeQL Kotlin extractor runs inside the Kotlin compiler and needs far more heap than a normal
      # build: with defaults the Kotlin daemon fails with "GC overhead limit exceeded". Give it an explicit
      # heap and limit parallel compilations so concurrent extractions fit in the runner's memory.
      - name: Build
        if: steps.decide.outputs.analyse == 'true'
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-parallel --no-configuration-cache --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx2g
          -Pkotlin.daemon.jvmargs=-Xmx6g
          clean classes testClasses -x detekt

      - name: Perform CodeQL Analysis
        if: steps.decide.outputs.analyse == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  # The npm packages of typescript/ (.github/codeql/codeql-javascript.yml): no build, the sources as they are.
  analyze-javascript:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-javascript.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
