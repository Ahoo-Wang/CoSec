# Security-focused static analysis (GitHub code scanning). Complements detekt and ESLint, which cover style and
# code smells. Kotlin requires CodeQL to observe a real compilation, hence the manual build without
# daemon or build cache; JavaScript and TypeScript need none (build-mode none), in a job of their own.
name: CodeQL
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'wiki/**'
      - 'docs/**'
      - '**/*.md'
      - 'skills/**'
  pull_request:
    # No path filter here: "Analyze (java-kotlin)" is a required check, so a skipped run would block docs-only PRs.
    branches: [ main ]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The JDK and Gradle's dependency cache, which only main writes (a pull request reads it): this job downloaded every
      # dependency on every run, and the plugin portal and Maven Central fail a cold resolution now and then (429, or a 404 for
      # an artifact that exists). The build below still compiles everything, with no build cache.
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      # Downloads only, retried, before CodeQL traces anything (.github/scripts/resolve-dependencies.sh): Gradle's own
      # distribution, the plugins and every dependency, so that the traced build below finds them and the retry never wraps
      # a compilation. services.gradle.org answers 504 often enough to fail this required check; this covers it too.
      - name: Resolve the dependencies
        run: .github/scripts/resolve-dependencies.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # The CodeQL Kotlin extractor runs inside the Kotlin compiler and needs far more heap than a normal
      # build: with defaults the Kotlin daemon fails with "GC overhead limit exceeded". Give it an explicit
      # heap and limit parallel compilations so concurrent extractions fit in the runner's memory.
      - name: Build
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-parallel --no-configuration-cache --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx2g
          -Pkotlin.daemon.jvmargs=-Xmx6g
          clean classes testClasses -x detekt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  # The npm packages of typescript/ (.github/codeql/codeql-javascript.yml): no build, the sources as they are.
  analyze-javascript:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-javascript.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
