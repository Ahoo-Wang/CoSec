# Security-focused static analysis (GitHub code scanning). Complements detekt, which covers style and
# code smells. Kotlin requires CodeQL to observe a real compilation, hence the manual build without
# daemon or build cache.
name: CodeQL
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'wiki/**'
      - 'docs/**'
      - '**/*.md'
      - 'skills/**'
  pull_request:
    # No path filter here: "Analyze (java-kotlin)" is a required check, so a skipped run would block docs-only PRs.
    branches: [ main ]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # The CodeQL Kotlin extractor runs inside the Kotlin compiler and needs far more heap than a normal
      # build: with defaults the Kotlin daemon fails with "GC overhead limit exceeded". Give it an explicit
      # heap and limit parallel compilations so concurrent extractions fit in the runner's memory.
      - name: Build
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-parallel --no-configuration-cache --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx2g
          -Pkotlin.daemon.jvmargs=-Xmx6g
          clean classes testClasses -x detekt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
