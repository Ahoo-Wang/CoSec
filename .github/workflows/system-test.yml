# The system test (test/system-test/README.md): the gateway image built from the commit under test, the services of
# test/system-*, and Redis, started with Docker Compose and driven over the network only. Not part of `check` or the CI
# gate. On demand for any commit (the RC candidate: `gh workflow run system-test.yml --ref main -f ref=<sha>`), nightly
# on main, and on the pull requests that change it. No secrets, read-only, nothing pushed; never retried.
name: System Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit, branch or tag to test (default, the ref the workflow runs on)
        required: false
        default: ''
      image:
        description: A published gateway image to test instead of building one from the ref (ghcr.io/ahoo-wang/ only)
        required: false
        default: ''
  schedule:
    - cron: '40 3 * * *'
  # Any base, so a batch stacked on another's branch runs too.
  pull_request:
    paths:
      - 'test/system-*/**'
      - 'platform/gateway-server/**'
      - 'k8s/**'
      - '.github/workflows/system-test.yml'

permissions:
  contents: read

concurrency:
  group: system-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  system:
    name: System test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Inputs reach the scripts through the environment only, never interpolated into a command.
      GATEWAY_IMAGE_INPUT: ${{ inputs.image }}
      ARTIFACT: system-test-${{ github.run_id }}-${{ github.run_attempt }}
      # Absolute: the scenarios' JVM runs in the module directory, and starts docker compose itself.
      COMPOSE_FILE: ${{ github.workspace }}/test/system-test/compose.yaml
      COSEC_SYSTEM_BEHIND_IMAGE: cosec-system-behind:test
      COSEC_SYSTEM_AUTH_IMAGE: cosec-system-auth:test
      COSEC_SYSTEM_ENFORCER_IMAGE: cosec-system-enforcer:test
      # A throwaway HMAC secret for this run's gateways: not a secret, and never a deployment's.
      COSEC_SYSTEM_JWT_SECRET: system-test-only-not-a-secret-0123456789abcdef
      COSEC_SYSTEM_GATEWAY_URL: http://127.0.0.1:8080
      COSEC_SYSTEM_GATEWAY2_URL: http://127.0.0.1:8081
      COSEC_SYSTEM_GATEWAY_STRICT_URL: http://127.0.0.1:8082
      COSEC_SYSTEM_GATEWAY_MANAGEMENT_URL: http://127.0.0.1:9081
      COSEC_SYSTEM_AUTH_URL: http://127.0.0.1:8090
      COSEC_SYSTEM_ENFORCER_URL: http://127.0.0.1:8091
      COSEC_SYSTEM_ENFORCER_MANAGEMENT_URL: http://127.0.0.1:8092
      COSEC_SYSTEM_REDIS_URL: redis://127.0.0.1:6379
    steps:
      # Before anything is pulled: only CoSec's own published images may be tested in place of the built one.
      - name: Check the inputs
        shell: bash
        run: |
          # The whole value, not one of its lines: bash's =~ anchors ^ and $ to the string.
          pattern='^ghcr\.io/ahoo-wang/[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?(@sha256:[0-9a-f]{64})?$'
          if [ -n "$GATEWAY_IMAGE_INPUT" ] && ! [[ "$GATEWAY_IMAGE_INPUT" =~ $pattern ]]; then
            echo "::error::the image input must be an image of ghcr.io/ahoo-wang/"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: temurin

      # Reads main's Gradle cache and never writes it, as the CI jobs do.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build the distributions
        run: ./gradlew :gateway-server:installDist :system-behind:installDist :system-auth:installDist :system-enforcer:installDist :migrate:installDist :system-test:testClasses

      # The image as the Dockerfile ships it, its AOT cache trained, for the runner's platform only.
      - name: Build or pull the gateway image
        run: |
          if [ -n "$GATEWAY_IMAGE_INPUT" ]; then
            docker pull "$GATEWAY_IMAGE_INPUT"
            echo "COSEC_SYSTEM_GATEWAY_IMAGE=$GATEWAY_IMAGE_INPUT" >> "$GITHUB_ENV"
          else
            docker build --tag cosec-gateway:system platform/gateway-server
            echo "COSEC_SYSTEM_GATEWAY_IMAGE=cosec-gateway:system" >> "$GITHUB_ENV"
          fi

      - name: Build the services' images
        run: |
          for app in behind auth enforcer; do
            docker build --file test/system-test/docker/app.Dockerfile --build-arg "APP=system-$app" \
              --tag "cosec-system-$app:test" "test/system-$app"
          done

      # Waits on each container's health check (liveness), never on a sleep.
      - name: Start the stack
        run: docker compose up --detach --wait --wait-timeout 240

      - name: Run the scenarios
        env:
          COSEC_SYSTEM_MIGRATE: ${{ github.workspace }}/migration/migrate/build/install/cosec-migrate/bin/cosec-migrate
        run: ./gradlew :system-test:systemTest

      # The TypeScript client through the gateway (cosec-fetcher): the same stack, a client that is not Kotlin. After the
      # scenarios whether or not they passed, so one run shows both; JUnit for the summary.
      - name: Set up pnpm
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.11

      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Run the TypeScript client's scenarios
        if: ${{ !cancelled() }}
        working-directory: typescript
        env:
          COSEC_SYSTEM_JUNIT: ${{ runner.temp }}/typescript-junit/TEST-typescript.xml
        run: |
          pnpm install --frozen-lockfile
          pnpm test:system

      - name: Collect the evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence/logs"
          docker compose ps --all > "$evidence/ps.txt" 2>&1 || true
          for service in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$service" > "$evidence/logs/$service.log" 2>&1 || true
            container=$(docker compose ps --all --quiet "$service")
            if [ -n "$container" ]; then
              docker inspect "$container" > "$evidence/logs/$service.inspect.json" 2>&1 || true
            fi
          done
          cp -r test/system-test/build/system/transcripts "$evidence/" 2>/dev/null || true
          cp -r test/system-test/build/test-results/systemTest "$evidence/junit" 2>/dev/null || true
          cp -r test/system-test/build/reports/tests/systemTest "$evidence/report" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/typescript-junit" "$evidence/typescript-junit" 2>/dev/null || true

      - name: Summarize
        if: always()
        run: |
          python3 test/system-test/scripts/summary.py \
            test/system-test/build/test-results/systemTest "$RUNNER_TEMP/typescript-junit" "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --timeout 30

  # The manifests of k8s/ on a real cluster (test/system-test/kind/run.sh): the dev overlay with the image under test, the
  # readiness gating, a decision, the scrape endpoint of the management port and the example NetworkPolicy. A job of its own:
  # the Compose stack above is what the scenarios drive; this proves the shipped manifests work as documented.
  kind:
    name: Kubernetes manifests on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATEWAY_IMAGE_INPUT: ${{ inputs.image }}
      ARTIFACT: system-test-kind-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the inputs
        shell: bash
        run: |
          pattern='^ghcr\.io/ahoo-wang/[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?(@sha256:[0-9a-f]{64})?$'
          if [ -n "$GATEWAY_IMAGE_INPUT" ] && ! [[ "$GATEWAY_IMAGE_INPUT" =~ $pattern ]]; then
            echo "::error::the image input must be an image of ghcr.io/ahoo-wang/"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build the distributions
        run: ./gradlew :gateway-server:installDist :migrate:installDist

      # The image as the Dockerfile ships it, or a published one under the tag the script loads into the cluster.
      - name: Build or pull the gateway image
        run: |
          if [ -n "$GATEWAY_IMAGE_INPUT" ]; then
            docker pull "$GATEWAY_IMAGE_INPUT"
            docker tag "$GATEWAY_IMAGE_INPUT" cosec-gateway:system
          else
            docker build --tag cosec-gateway:system platform/gateway-server
          fi

      # kind and kubectl come with the runner image; the script says so when they do not.
      - name: Run the kind leg
        run: |
          set -o pipefail
          test/system-test/kind/run.sh cosec-gateway:system "$PWD/migration/migrate/build/install/cosec-migrate/bin/cosec-migrate" 2>&1 \
            | tee "$RUNNER_TEMP/kind-leg.log"

      - name: Collect the evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/kind-evidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/kind-leg.log" "$evidence/" 2>/dev/null || true
          kubectl get all,endpoints,networkpolicy,events -A -o wide > "$evidence/cluster.txt" 2>&1 || true
          kubectl describe pods -A > "$evidence/pods.txt" 2>&1 || true
          kubectl -n cosec-dev logs deployment/cosec-gateway --all-containers > "$evidence/gateway.log" 2>&1 || true
          kubectl -n cosec-dev logs deployment/redis --all-containers > "$evidence/redis.log" 2>&1 || true
          kind export logs "$evidence/kind" --name cosec-system > /dev/null 2>&1 || true

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Kubernetes manifests on kind"
            echo
            echo "Evidence (cluster state, pod logs, the script's output): artifact \`$ARTIFACT\`."
            echo
            grep -E '^(ok|FAIL|kind leg)' "$RUNNER_TEMP/kind-leg.log" 2>/dev/null | sed 's/^/- /' || echo "- the leg did not start"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/kind-evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name cosec-system || true
