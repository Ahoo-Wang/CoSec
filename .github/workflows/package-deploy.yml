name: Packages Deploy
on:
  release:
    types: [created]

jobs:
  github-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Publish package
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          SIGNING_SECRETKEY: ${{ secrets.SIGNING_SECRETKEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
  central-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Publish package
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          SIGNING_SECRETKEY: ${{ secrets.SIGNING_SECRETKEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
  # The one-time 7.x to 8.0 data converter, as a download for the release, not a Maven artifact: nothing depends on
  # cosec-migrate, its contract is its command line (wiki/operations/upgrading.md#migrating-the-data).
  migrate-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build the distribution
        run: ./gradlew :migrate:distZip

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd migration/migrate/build/distributions
          sha256sum cosec-migrate-*.zip > "$(ls cosec-migrate-*.zip).sha256"
          gh release upload "$TAG" cosec-migrate-*.zip cosec-migrate-*.zip.sha256 --repo "$GITHUB_REPOSITORY"
