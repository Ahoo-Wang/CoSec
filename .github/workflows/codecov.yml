name: Codecov
on:
  push:
    paths-ignore:
      - 'document/**'
      - 'cosec-gateway-server/**'
  pull_request:
    paths-ignore:
      - 'document/**'
      - 'cosec-gateway-server/**'

permissions:
  contents: read

concurrency:
  group: codecov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    env:
      CODECOV: true
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build Code Coverage Report
        run: ./gradlew codeCoverageReport --stacktrace

      - name: Upload Code Coverage Report to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests # optional
          name: codecov-umbrella # optional
          fail_ci_if_error: true # optional (default = false)
          verbose: true # optional (default = false)
          #          directory: ./build/reports/jacoco/codeCoverageReport/
          files: ./code-coverage-report/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml
          path_to_write_report: ./coverage/codecov_report.txt
