name: Codecov
on:
  push:
    paths-ignore:
      - 'platform/gateway-server/**'
  pull_request:
    paths-ignore:
      - 'platform/gateway-server/**'

permissions:
  contents: read

concurrency:
  group: codecov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    env:
      CODECOV: true
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Code Coverage Report
        # Coverage must come from real test runs, never from build-cache hits.
        run: ./gradlew codeCoverageReport --stacktrace --no-build-cache

      # Without the report the uploader searches the workspace and sends whatever it finds (once a configuration-cache
      # file), which Codecov reads as 0 % coverage: require the report, and turn the search off.
      - name: Check the coverage report
        run: |
          report=test/code-coverage-report/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml
          if [ ! -s "$report" ] || ! grep -q '<counter type="LINE"' "$report"; then
            echo "::error::no aggregated coverage report at $report"
            exit 1
          fi

      - name: Upload Code Coverage Report to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
          disable_search: true
          files: ./test/code-coverage-report/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml
