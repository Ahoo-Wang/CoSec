# Path-based pull request labels (actions/labeler), namespaced `module:` / `area:`.
# Release-note categories (.github/release.yml) are driven only by the type labels derived from the
# Conventional Commits PR title in .github/workflows/pull-request.yml, so path labels must never reuse
# category label names: GitHub files each PR under the first matching category.

'module: api':
  - changed-files:
      - any-glob-to-any-file: 'api/api/**'
'module: core':
  - changed-files:
      - any-glob-to-any-file: 'core/core/**'
'module: jwt':
  - changed-files:
      - any-glob-to-any-file: 'extensions/jwt/**'
'module: cocache':
  - changed-files:
      - any-glob-to-any-file: 'backends/cocache/**'
'module: social':
  - changed-files:
      - any-glob-to-any-file: 'extensions/social/**'
'module: webmvc':
  - changed-files:
      - any-glob-to-any-file: 'edge/webmvc/**'
'module: webflux':
  - changed-files:
      - any-glob-to-any-file: 'edge/webflux/**'
'module: gateway':
  - changed-files:
      - any-glob-to-any-file: 'edge/gateway/**'
'module: gateway-server':
  - changed-files:
      - any-glob-to-any-file: 'platform/gateway-server/**'
'module: opentelemetry':
  - changed-files:
      - any-glob-to-any-file: 'extensions/opentelemetry/**'
'module: ip2region':
  - changed-files:
      - any-glob-to-any-file: 'extensions/ip2region/**'
'module: openapi':
  - changed-files:
      - any-glob-to-any-file: 'edge/openapi/**'
'module: micrometer':
  - changed-files:
      - any-glob-to-any-file: 'extensions/micrometer/**'
'module: migrate':
  - changed-files:
      - any-glob-to-any-file: 'migration/migrate/**'
'module: e2e':
  - changed-files:
      - any-glob-to-any-file: 'test/e2e/**'
'module: kafka':
  - changed-files:
      - any-glob-to-any-file: 'backends/kafka/**'
'module: engine':
  - changed-files:
      - any-glob-to-any-file: ['core/model/**', 'core/engine/**']
'module: runtime':
  - changed-files:
      - any-glob-to-any-file: 'core/runtime/**'
'module: control':
  - changed-files:
      - any-glob-to-any-file: 'core/control/**'
'module: testkit':
  - changed-files:
      - any-glob-to-any-file: 'test/testkit/**'
'module: conformance':
  - changed-files:
      - any-glob-to-any-file: 'test/conformance/**'
'module: spring-boot':
  - changed-files:
      - any-glob-to-any-file: 'host/spring-boot/**'
'module: architecture':
  - changed-files:
      - any-glob-to-any-file: 'test/architecture/**'
'module: bom':
  - changed-files:
      - any-glob-to-any-file: 'bom/bom/**'
'module: dependencies':
  - changed-files:
      - any-glob-to-any-file: 'bom/dependencies/**'

'area: docs':
  - changed-files:
      - any-glob-to-any-file: ['wiki/**', '**/*.md', 'llms.txt']

'area: ci':
  - changed-files:
      - any-glob-to-any-file: '.github/**'

'area: build':
  - changed-files:
      - any-glob-to-any-file: ['**/*.gradle.kts', 'gradle/**', 'gradle.properties', 'config/**', 'wiki/package.json', 'wiki/pnpm-lock.yaml']


'area: test':
  - changed-files:
      - any-glob-to-any-file: ['**/src/test/**', '**/src/jmh/**']
