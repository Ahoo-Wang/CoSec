# Path-based pull request labels (actions/labeler), namespaced `module:` / `area:`.
# Release-note categories (.github/release.yml) are driven only by the type labels derived from the
# Conventional Commits PR title in .github/workflows/pull-request.yml, so path labels must never reuse
# category label names: GitHub files each PR under the first matching category.

'module: api':
  - changed-files:
      - any-glob-to-any-file: 'api/**'
'module: core':
  - changed-files:
      - any-glob-to-any-file: 'core/**'
'module: jwt':
  - changed-files:
      - any-glob-to-any-file: 'jwt/**'
'module: cocache':
  - changed-files:
      - any-glob-to-any-file: 'cocache/**'
'module: social':
  - changed-files:
      - any-glob-to-any-file: 'social/**'
'module: webmvc':
  - changed-files:
      - any-glob-to-any-file: 'webmvc/**'
'module: webflux':
  - changed-files:
      - any-glob-to-any-file: 'webflux/**'
'module: gateway':
  - changed-files:
      - any-glob-to-any-file: 'gateway/**'
'module: gateway-server':
  - changed-files:
      - any-glob-to-any-file: 'gateway-server/**'
'module: opentelemetry':
  - changed-files:
      - any-glob-to-any-file: 'opentelemetry/**'
'module: ip2region':
  - changed-files:
      - any-glob-to-any-file: 'ip2region/**'
'module: openapi':
  - changed-files:
      - any-glob-to-any-file: 'openapi/**'
'module: kafka':
  - changed-files:
      - any-glob-to-any-file: 'kafka/**'
'module: engine':
  - changed-files:
      - any-glob-to-any-file: ['model/**', 'engine/**']
'module: runtime':
  - changed-files:
      - any-glob-to-any-file: 'runtime/**'
'module: control':
  - changed-files:
      - any-glob-to-any-file: 'control/**'
'module: testkit':
  - changed-files:
      - any-glob-to-any-file: 'testkit/**'
'module: conformance':
  - changed-files:
      - any-glob-to-any-file: 'conformance/**'
'module: spring-boot-starter':
  - changed-files:
      - any-glob-to-any-file: 'spring-boot-starter/**'
'module: bom':
  - changed-files:
      - any-glob-to-any-file: 'bom/**'
'module: dependencies':
  - changed-files:
      - any-glob-to-any-file: 'dependencies/**'

'area: docs':
  - changed-files:
      - any-glob-to-any-file: ['wiki/**', 'document/**', '**/*.md', 'llms.txt']

'area: ci':
  - changed-files:
      - any-glob-to-any-file: '.github/**'

'area: build':
  - changed-files:
      - any-glob-to-any-file: ['**/*.gradle.kts', 'gradle/**', 'gradle.properties', 'config/**', 'wiki/package.json', 'wiki/pnpm-lock.yaml']


'area: test':
  - changed-files:
      - any-glob-to-any-file: ['**/src/test/**', '**/src/jmh/**']
