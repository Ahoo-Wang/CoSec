name: Set up Java and Gradle
description: Temurin JDK (17 unless told otherwise) and Gradle with its cache, which only main writes.
inputs:
  java-version:
    description: JDK versions, one per line; the last one becomes JAVA_HOME
    required: false
    default: '17'
runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin

    # Pull requests and other branches read main's cache and never write their own, so the cache stays main's.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
