# CodeQL's configuration for the JavaScript and TypeScript of the repository (job `analyze-javascript` of
# .github/workflows/codeql.yml): the npm packages of typescript/, their tests and scripts. What npm installs and what a build
# writes are not CoSec's code.
name: CoSec code scanning (JavaScript and TypeScript)

paths:
  - typescript

paths-ignore:
  - '**/node_modules'
  - '**/dist'
  - '**/coverage'
