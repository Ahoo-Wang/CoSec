codecov:
  notify:
    # One upload per CI test job with coverage (scripts/ci/plan.py fails CI when this count is wrong): the statuses
    # wait for all of them, so a partial merge is never reported as the commit's coverage.
    after_n_builds: 8
comment:
  after_n_builds: 8
coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    patch:
      default:
        # new and changed lines must be well tested
        target: 80%
        threshold: 1%
    project:
      default:
        # coverage must not drop by more than 1% from the base commit
        target: auto
        threshold: 1%
ignore:
  - "api/api/.*"
  - "platform/gateway-server/.*"
