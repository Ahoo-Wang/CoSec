coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    patch:
      default:
        # new and changed lines must be well tested
        target: 80%
        threshold: 1%
    project:
      default:
        # coverage must not drop by more than 1% from the base commit
        target: auto
        threshold: 1%
ignore:
  - "document/.*"
  - "cosec-api/.*"
  - "cosec-gateway-server/.*"
