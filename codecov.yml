codecov:
  notify:
    # Statuses and the comment are sent once the commit's checks have finished, so they never report a partial merge of
    # the uploads. No fixed number of uploads is awaited: a pull request skips the test jobs its change cannot reach
    # (scripts/ci/plan.py), which upload nothing, and the flags below carry their last report forward instead.
    wait_for_ci: true
coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    patch:
      default:
        # new and changed lines must be well tested
        target: 80%
        threshold: 1%
    project:
      default:
        # coverage must not drop by more than 1% from the base commit
        target: auto
        threshold: 1%
ignore:
  - "api/api/.*"
  - "platform/gateway-server/.*"
  # The measurement harnesses: `main`s in test sources (never a main source) that CI compiles and never runs (docs/reviews/2026-11/README.md).
  - "**/src/test/**/*Measurement.kt"
flags:
  # One flag per test job that uploads (scripts/ci/plan.py fails CI when one is missing): a job a pull request skips
  # keeps the coverage of the commit it is based on, which its change cannot have altered.
  backends:
    carryforward: true
  core:
    carryforward: true
  edge:
    carryforward: true
  extensions:
    carryforward: true
  host:
    carryforward: true
  migration:
    carryforward: true
  test:
    carryforward: true
  typescript:
    paths:
      - typescript/
