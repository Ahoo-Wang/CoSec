# The service behind the gateway (test/system-test's topology). It trusts any CoSec-Identity it receives: in the system test only
# the gateway reaches it, on the Compose network; its port is published to the runner for the health check alone.
server:
  port: 8080
spring:
  application:
    name: system-behind
cosec:
  pipeline:
    mode: gateway
    identity:
      # STA-7: true here, and only here: the compose network gives this service to the gateways alone, and no port of it is
      # published to the runner.
      only-gateway-can-reach: true
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
