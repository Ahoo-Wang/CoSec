# The system test's login and control-plane host (test/system-test's topology). Redis and the JWT secret come from the
# environment (compose.yaml); the shortened bounds of the control plane from test/system-test/profile/shortened-bounds.yaml.
server:
  port: 8080
spring:
  application:
    name: system-auth
cosec:
  audit:
    kafka:
      # The decision audit is the gateways' here; this process audits nothing to Kafka (the control plane's change events are
      # turned on by the deployment, cosec.control.audit.kafka.enabled, where it embeds the control plane).
      enabled: false
  jwt:
    algorithm: hmac256
    secret: ${COSEC_JWT_SECRET}
    session:
      # STA-8: the starter's refresh keeps the memberships of the token it replaces. This host has no member store to read them
      # again from: /auth/login takes the roles from its request, so there is nothing a MembershipRefresh could look up.
      memberships-on-refresh: from-token
  authentication:
    login:
      refresh:
        path: /auth/refresh
      logout:
        path: /auth/logout
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
