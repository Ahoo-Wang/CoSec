# The enforcing servlet service of the system test (test/system-test's topology). Redis and the JWT secret come from the
# environment (compose.yaml). Its health probes are on the management port, outside CoSec on Spring MVC, so liveness
# answers before any document is published; the application port decides everything with the documents.
server:
  port: 8080
spring:
  application:
    name: system-enforcer
cosec:
  api-key:
    enabled: true
    store: redis
  jwt:
    algorithm: hmac256
    secret: ${COSEC_JWT_SECRET}
  authentication:
    login:
      enabled: false
  authorization:
    scope:
      app-id: orders
management:
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics
