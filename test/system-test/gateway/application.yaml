# The gateways' configuration in the system test, mounted as the image's config/application.yaml (compose.yaml). The image
# keeps its own defaults in the jar and reads this in addition: this file holds only what the run adds, the routes the
# scenarios call and the secret. Nothing here shortens a documented bound.
spring:
  cloud:
    # No discovery client in the image: lb://behind resolves through this list, as lb://cosec-auth does in k8s/base.
    discovery:
      client:
        simple:
          instances:
            behind:
              - uri: http://behind:8080
            auth:
              - uri: http://auth:8080
            # The control plane's operators' API is served by one replica of the control-plane host (leg 1) or by the IAM that
            # embeds it (leg 2, SYSTEM_CONTROL_TARGET=auth, whose instance is the one above). Leg 1:
            # one replica of the control-plane host: the operators' scenarios read what they have written, which a second
            # replica serves a moment after its invalidation message (the scenarios that address both replicas do it by
            # port, ControlHostScenario).
            control:
              - uri: http://control-1:8080
    gateway:
      server:
        webflux:
          routes:
            # A registered service: it receives the verified identity (IDN-7). The path goes on as the client sent it,
            # so the service echoes the path the gateway decided on.
            - id: behind
              uri: lb://behind
              predicates:
                - Path=/behind/**
            # The login host's sign-in, refresh and logout. The pair travels in the body; the host decides for itself.
            - id: auth
              uri: lb://auth
              predicates:
                - Path=/auth/**
            # The IAM's operator routes (an onboarding, a grant): decided here for root only (the platform document), then by the IAM.
            - id: iam-admin
              uri: lb://auth
              predicates:
                - Path=/admin/**
            # The control plane's operators' API: the token verified and the route decided here, the identity forwarded, each
            # action decided again at the host. It names the control plane's app, which the tokens of its operators are for.
            - id: control
              uri: lb://${SYSTEM_CONTROL_TARGET:control}
              predicates:
                - Path=/cosec/control/**
              metadata:
                cosec-app-id: cosec-control
            # The same service by its address, with no cosec-identity metadata: it receives no identity (IDN-7).
            - id: plain
              uri: http://behind:8080
              predicates:
                - Path=/plain/**
            # Two apps behind one gateway, one service: each route names its app, which is what a gateway that fronts
            # several apps does (MultiAppScenario). The routes above name none, and serve every app (SCP-11).
            - id: shop
              uri: lb://behind
              predicates:
                - Path=/shop/**
              metadata:
                cosec-app-id: shop
            - id: ledger
              uri: lb://behind
              predicates:
                - Path=/ledger/**
              metadata:
                cosec-app-id: ledger
cosec:
  jwt:
    algorithm: hmac256
    secret: ${COSEC_JWT_SECRET}
