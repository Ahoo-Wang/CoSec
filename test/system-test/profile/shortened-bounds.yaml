# TEST CONFIGURATION ONLY: never copy any of this into a deployment.
#
# The bounds the system test shortens so that a scenario finishes in seconds, every one in this file and nowhere else,
# each with the default it replaces. compose.yaml gives the file to every CoSec process (spring.config.additional-location);
# the harness's bounds (test/system-test/src/test/kotlin/me/ahoo/cosec/system/Bound.kt) are derived from these values.
cosec:
  authorization:
    snapshot:
      fail-closed:
        # Default: no tenant fails closed. The tenant `lagging` of the Redis outage scenario does...
        tenants: [ lagging ]
        # ...Default 30m: once the oldest document it reads was last confirmed 20 seconds ago.
        max-lag: 20s
    shadow:
      # Default 0.1: every request is evaluated again on a staged candidate, so a window fills from a few requests.
      sample-rate: 1.0
      # (An instance writes its window report every second with the min-duration below: the report interval is a fifth of
      # the window's shortest life, at least a second, and 10 s at the default.)
  control:
    shadow:
      # Default 15m: a window may close after 5 seconds...
      min-duration: 5s
      # Default 1000: ...once the instances have reported 20 compared samples.
      min-samples: 20
      # (The open windows are looked at every 333 ms with it: a fifteenth of the window's shortest life, and a minute at
      # the default.)
