# The system test's topology (test/system-test/README.md): two replicas of the gateway image built from the commit under
# test, a service behind them in cosec.pipeline.mode=gateway, two replicas of the control-plane host image (also built from
# the commit), the IAM service that issues the tokens, an enforcing servlet service, and Redis as the store of record. The
# scenarios reach them through ports bound to the runner's loopback interface, and the service behind not at all: it
# believes any CoSec-Identity, so only the gateways reach it. The control hosts believe it too (STA-9): the runner's
# loopback is this test's network boundary, as a NetworkPolicy is a deployment's.
name: cosec-system

x-cosec: &cosec
  SPRING_DATA_REDIS_URL: redis://redis:6379
  COSEC_JWT_SECRET: ${COSEC_SYSTEM_JWT_SECRET:?the throwaway HMAC secret of the run}
  # The shortened bounds, test configuration only: profile/shortened-bounds.yaml says what each replaces.
  SPRING_CONFIG_ADDITIONALLOCATION: optional:file:/opt/system/shortened-bounds.yaml

# The gateways audit to Kafka (the image turns it off by default): what a deployment that keeps an audit trail runs.
x-kafka: &kafka
  COSEC_AUDIT_KAFKA_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

# The control-plane host, two replicas of one image: the operators' API on 8080 (the gateways route to it), the service API on
# 8082 (the narrow profile, for the services that call it directly), the management port on 8081. It trusts the identity
# header of whoever reaches it and says so (cosec.pipeline.identity.only-trusted-callers-can-reach, spelled as the
# environment variable of the binder); it runs the maintenance passes (shadow windows, revisions), so the shortened bounds
# of profile/shortened-bounds.yaml are read here.
x-control: &control
  image: ${COSEC_SYSTEM_CONTROL_IMAGE:-cosec-control:system}
  depends_on:
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment:
    SPRING_DATA_REDIS_URL: redis://redis:6379
    SPRING_CONFIG_ADDITIONALLOCATION: optional:file:/opt/system/shortened-bounds.yaml
    COSEC_PIPELINE_IDENTITY_ONLYTRUSTEDCALLERSCANREACH: "true"
    # The change events: what a deployment that keeps an audit trail of its policy changes runs (topic cosec-control-audit).
    COSEC_CONTROL_AUDIT_KAFKA_ENABLED: "true"
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    JAVA_OPTS: -Xms192m -Xmx384m -XX:MaxDirectMemorySize=128m -Djava.net.preferIPv4Stack=true
  volumes:
    - ./profile:/opt/system:ro
  # The liveness group on the management port, as the image's own HEALTHCHECK, more often; readiness is a scenario's.
  healthcheck:
    test: [ CMD, curl, -fs, -o, /dev/null, http://localhost:8081/actuator/health/liveness ]
    interval: 2s
    timeout: 3s
    retries: 90

x-gateway: &gateway
  image: ${COSEC_SYSTEM_GATEWAY_IMAGE:-cosec-gateway:system}
  depends_on:
    redis:
      condition: service_healthy
    behind:
      condition: service_healthy
    kafka:
      condition: service_healthy
    control-1:
      condition: service_healthy
  environment:
    <<: [ *cosec, *kafka ]
    # After the image's own options (-Xmx2048M, ZGC, ...), so these win; a runner has room for this.
    JAVA_OPTS: -Xms256m -Xmx512m -XX:MaxDirectMemorySize=128m -Djava.net.preferIPv4Stack=true
  # ./config/application.yaml, read in addition to the image's own defaults (the routes and the secret; nothing the image keeps itself).
  volumes:
    - ./gateway:/opt/cosec-gateway-server/config:ro
    - ./profile:/opt/system:ro
  # The liveness group on the gateway's port, as the image's own HEALTHCHECK, more often: readiness is what the cold start asserts.
  healthcheck:
    test: [ CMD, curl, -fs, -o, /dev/null, http://localhost:8080/livez ]
    interval: 2s
    timeout: 3s
    retries: 90

services:
  redis:
    image: redis:7.4
    # noeviction: Redis is the store of record, and each instance refuses to start otherwise (SNP-3). A run starts from an
    # empty Redis, which the cold start scenario needs; the append-only file, in the container, keeps the documents across
    # the outage scenario's `docker compose stop redis` and `start`, as a Redis with persistence keeps them across a restart.
    command: [ redis-server, --maxmemory-policy, noeviction, --maxmemory, 256mb, --appendonly, "yes", --appendfsync, always, --save, "" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ CMD, redis-cli, ping ]
      interval: 1s
      timeout: 3s
      retries: 30

  # A single-node KRaft broker for the gateways' audit topic (cosec.audit.kafka.topic, `cosec-audit`), created on first use.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, "localhost:9092" ]
      interval: 3s
      timeout: 10s
      retries: 60

  behind:
    image: ${COSEC_SYSTEM_BEHIND_IMAGE:-cosec-system-behind:test}
    environment:
      JAVA_OPTS: -Xms128m -Xmx256m
    # No port on the runner. The image has no curl: bash asks the liveness group itself.
    healthcheck:
      test: [ CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /actuator/health/liveness HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "' ]
      interval: 2s
      timeout: 3s
      retries: 90

  # The IAM: it issues the tokens (a login of its own, the starter's refresh and logout routes) and calls the control-plane
  # host's service port as a service of its own. It embeds no control plane in this leg: the control API is the hosts'.
  auth:
    image: ${COSEC_SYSTEM_AUTH_IMAGE:-cosec-system-auth:test}
    depends_on:
      redis:
        condition: service_healthy
      control-1:
        condition: service_healthy
    environment:
      <<: *cosec
      COSEC_CONTROL_ENABLED: "false"
      SYSTEM_CONTROL_SERVICE_URL: http://control-1:8082
      JAVA_OPTS: -Xms192m -Xmx384m
    volumes:
      - ./profile:/opt/system:ro
    ports:
      - "127.0.0.1:8090:8080"
    # A WebFlux application's probes are requests like any other, refused until the platform document is published, so
    # the container is healthy once it listens (the deployment guide's tcpSocket probe); readiness is a scenario's.
    healthcheck:
      test: [ CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080' ]
      interval: 2s
      timeout: 3s
      retries: 90

  enforcer:
    image: ${COSEC_SYSTEM_ENFORCER_IMAGE:-cosec-system-enforcer:test}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *cosec
      JAVA_OPTS: -Xms192m -Xmx384m
    volumes:
      - ./profile:/opt/system:ro
    ports:
      - "127.0.0.1:8091:8080"
      # The management port, outside CoSec on Spring MVC: its probes answer before any document is published.
      - "127.0.0.1:8092:8081"
    healthcheck:
      test: [ CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf "GET /actuator/health/liveness HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "' ]
      interval: 2s
      timeout: 3s
      retries: 90

  control-1:
    <<: *control
    ports:
      # The operators' API, the service API and the management port, each on its own: the scenarios call the replicas
      # directly where a scenario is about one of them or about a port (the gateways route to control-1).
      - "127.0.0.1:8095:8080"
      - "127.0.0.1:8097:8082"
      - "127.0.0.1:9095:8081"

  control-2:
    <<: *control
    ports:
      - "127.0.0.1:8096:8080"
      - "127.0.0.1:8098:8082"
      - "127.0.0.1:9096:8081"

  gw-1:
    <<: *gateway
    ports:
      - "127.0.0.1:8080:8080"
      # The management port: /actuator/health and the scrape endpoint /actuator/prometheus. Nothing authorizes it.
      - "127.0.0.1:9081:8081"

  gw-2:
    <<: *gateway
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9082:8081"

  # A third gateway of the same image that refuses a token while the revocations cannot be read, instead of accepting it
  # (the documented exception, cosec.authentication.revocation.fail-closed, off by default): the outage scenario asks both.
  gw-strict:
    <<: *gateway
    environment:
      <<: [ *cosec, *kafka ]
      JAVA_OPTS: -Xms256m -Xmx512m -XX:MaxDirectMemorySize=128m -Djava.net.preferIPv4Stack=true
      COSEC_AUTHENTICATION_REVOCATION_FAILCLOSED: "true"
    ports:
      - "127.0.0.1:8082:8080"
