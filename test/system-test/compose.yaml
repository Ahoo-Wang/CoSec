# The system test's topology (test/system-test/README.md): the gateway image built from the commit under test, a service
# behind it in cosec.pipeline.mode=gateway, and Redis as the store of record. The scenarios reach the gateway and Redis
# through ports bound to the runner's loopback interface, and nothing else: the service behind believes any
# CoSec-Identity, so only the gateway reaches it, on this network.
name: cosec-system

services:
  redis:
    image: redis:7.4
    # noeviction: Redis is the store of record, and each instance refuses to start otherwise (SNP-3). No persistence: a
    # run starts from an empty Redis, which the cold start scenario needs.
    command: [ redis-server, --maxmemory-policy, noeviction, --maxmemory, 256mb, --appendonly, "no", --save, "" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ CMD, redis-cli, ping ]
      interval: 1s
      timeout: 3s
      retries: 30

  behind:
    image: ${COSEC_SYSTEM_BEHIND_IMAGE:-cosec-system-behind:test}
    environment:
      JAVA_OPTS: -Xms128m -Xmx256m
    # No port on the runner. The image has no curl: bash asks the liveness group itself.
    healthcheck:
      test: [ CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /actuator/health/liveness HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "' ]
      interval: 2s
      timeout: 3s
      retries: 90

  gw-1:
    image: ${COSEC_SYSTEM_GATEWAY_IMAGE:-cosec-gateway:system}
    depends_on:
      redis:
        condition: service_healthy
      behind:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_URL: redis://redis:6379
      COSEC_JWT_SECRET: ${COSEC_SYSTEM_JWT_SECRET:?the gateways' throwaway HMAC secret}
      # After the image's own options (-Xmx2048M, ZGC, ...), so these win; a runner has room for this.
      JAVA_OPTS: -Xms256m -Xmx512m -XX:MaxDirectMemorySize=128m -Djava.net.preferIPv4Stack=true
    # The configuration the image reads, ./config/, replaced as the Kubernetes base replaces it.
    volumes:
      - ./gateway:/opt/cosec-gateway-server/config:ro
    ports:
      - "127.0.0.1:8080:8080"
    # The liveness group, as the image's own HEALTHCHECK, more often: readiness is what the cold start asserts.
    healthcheck:
      test: [ CMD, curl, -fs, -o, /dev/null, http://localhost:8080/actuator/health/liveness ]
      interval: 2s
      timeout: 3s
      retries: 90
