allowBuilds:
  esbuild: true

# vitepress 1.x pins vite 5 and older transitive versions that carry advisories;
# Dependabot cannot bump transitive dependencies, so force the patched versions.
overrides:
  vite: ^6.4.5
  vue: ^3.5.44
  '@vue/server-renderer': ^3.5.44
  katex: ^0.19.0
  source-map-js: ^1.2.2
