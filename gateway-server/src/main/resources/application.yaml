server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1KB
spring:
  application:
    name: ${service.name:cosec-gateway}
  web:
    error:
      whitelabel:
        enabled: false
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                exposed-headers: "*"
                max-age: 1800000
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            - id: cosec-auth
              uri: lb://cosec-auth
              predicates:
                - Path=/cosec-auth/**
              filters:
                - StripPrefix=1
            - id: google
              uri: https://www.google.com
              predicates:
                - Path=/google/**
              filters:
                - StripPrefix=1
cosec:
  audit:
    kafka:
      enabled: false
  authentication:
    login:
      enabled: false
  jwt:
    algorithm: hmac256
    # Required. No fallback: a well-known default would let anyone mint valid tokens.
    secret: ${COSEC_JWT_SECRET}
  ip2region:
    enabled: false

logging:
  level:
    root: info
management:
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for the Kubernetes probes, on any platform. Readiness stays
      # REFUSING_TRAFFIC until the platform document and the prewarmed documents are installed.
      probes:
        enabled: true
