[versions]
# libraries
spring-boot = "4.1.2"
# kotlinx-coroutines (core, reactor, slf4j, test, debug) and opentelemetry-extension-kotlin take their versions from the
# BOMs above (kotlinx-coroutines-bom, opentelemetry-bom), so they stay aligned with Spring Boot (RFC 0006 Q7).
spring-cloud = "2025.1.4"
cosid = "4.0.2"
cocache = "6.7.0"
opentelemetry = "2.32.0"
guava = "33.7.2-jre"
kotlin-logging = "8.0.4"
ognl = "3.4.16"
java-jwt = "4.6.2"
ip2region = "3.3.7"
justAuth = "1.16.7"
swagger = "2.2.55"
springdoc = "3.1.1"
# testing
junit = "6.1.3"
fluent-assert = "1.2.1"
mockk = "1.14.11"
jmh = "1.37"
archunit = "1.5.1"
blockhound = "1.0.18.RELEASE"
# SchemaConformanceTest only (RFC 0007 §10.4); never on a runtime classpath
json-schema-validator = "3.0.8"
# plugins
detekt = "1.23.8"
dokka = "2.2.0"
kotlin = "2.4.21"
publish-plugin = "2.0.0"
jmh-plugin = "0.7.3"
[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
cosid-bom = { module = "me.ahoo.cosid:cosid-bom", version.ref = "cosid" }
cocache-bom = { module = "me.ahoo.cocache:cocache-bom", version.ref = "cocache" }
opentelemetry-instrumentation-bom = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom", version.ref = "opentelemetry" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
ognl = { module = "ognl:ognl", version.ref = "ognl" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "java-jwt" }
ip2region = { module = "org.lionsoul:ip2region", version.ref = "ip2region" }
justAuth = { module = "me.zhyd.oauth:JustAuth", version.ref = "justAuth" }
swagger = { module = "io.swagger.core.v3:swagger-core-jakarta", version.ref = "swagger" }
springdoc-bom = { module = "org.springdoc:springdoc-openapi-bom", version.ref = "springdoc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
fluent-assert-bom = { module = "me.ahoo.test:fluent-assert-bom", version.ref = "fluent-assert" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
blockhound = { module = "io.projectreactor.tools:blockhound", version.ref = "blockhound" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "publish-plugin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }

